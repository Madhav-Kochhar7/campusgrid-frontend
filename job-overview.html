<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusGrid - Job Overview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    
    /* CSS Animations */
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up {
      animation: fadeInUp 0.5s ease-out forwards;
      opacity: 0;
    }

    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">

  <div class="flex h-screen relative z-10">
    
    <!-- Mobile Overlay -->
    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-20 hidden lg:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white border-r border-slate-200 transform -translate-x-full lg:translate-x-0 transition-all duration-300 z-30 flex flex-col shadow-sm">
      <div class="p-6 border-b border-slate-100 flex items-center justify-between min-h-[73px]">
        <h1 id="brand-label" class="text-xl font-bold text-blue-600 tracking-tight transition-opacity duration-300">CampusGrid</h1>
        <button id="close-sidebar" class="lg:hidden text-slate-400 hover:text-slate-600 ml-auto">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      
      <nav class="flex-1 p-4 space-y-2 overflow-y-auto overflow-x-hidden no-scrollbar">
        <a href="index.html" class="flex items-center px-3 py-2.5 text-slate-500 hover:bg-slate-100 hover:text-slate-900 rounded-lg transition-colors group">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
          <span class="nav-label ml-3 whitespace-nowrap transition-opacity duration-300">Overview</span>
        </a>
        <a href="submit-job.html" class="flex items-center px-3 py-2.5 text-slate-500 hover:bg-slate-100 hover:text-slate-900 rounded-lg transition-colors group">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          <span class="nav-label ml-3 whitespace-nowrap transition-opacity duration-300">Submit Job</span>
        </a>
        <a href="job-history.html" class="flex items-center px-3 py-2.5 bg-blue-50 text-blue-600 font-medium rounded-lg transition-colors group">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span class="nav-label ml-3 whitespace-nowrap transition-opacity duration-300">Job History</span>
        </a>
        <a href="contribute.html" class="flex items-center px-3 py-2.5 text-slate-500 hover:bg-slate-100 hover:text-slate-900 rounded-lg transition-colors group">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
          <span class="nav-label ml-3 whitespace-nowrap transition-opacity duration-300">Contribute</span>
        </a>
      </nav>
      
      <!-- User & Collapse Toggle -->
      <div class="border-t border-slate-100 flex flex-col pb-2">
        <button id="sidebar-collapse-toggle" class="hidden lg:flex w-full items-center justify-center py-3 text-slate-400 hover:text-slate-600 transition-colors border-b border-slate-100 mb-2">
          <svg class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
        </button>
        <div class="px-3">
          <div class="flex items-center p-2 rounded-lg hover:bg-slate-50 transition-colors cursor-pointer overflow-hidden">
            <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex shrink-0 items-center justify-center font-bold text-sm relative">
              S
              <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border-2 border-white rounded-full"></span>
            </div>
            <div id="user-details" class="ml-3 min-w-0 transition-opacity duration-300">
              <p class="text-sm font-medium text-slate-900 truncate">student@campus</p>
              <p class="text-xs text-slate-500 truncate">Online</p>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 flex flex-col h-full lg:ml-64 w-full transition-all duration-300">
      <!-- Header -->
      <header class="bg-white border-b border-slate-200 h-16 flex items-center px-6 justify-between shrink-0 z-20 shadow-sm">
        <div class="flex items-center">
          <button id="menu-toggle" class="lg:hidden mr-4 text-slate-500 hover:text-slate-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
          <div class="text-sm text-slate-500">
            <span>CampusGrid</span>
            <span class="mx-2 text-slate-300">/</span>
            <a href="job-history.html" class="hover:text-blue-600 transition-colors">Jobs</a>
            <span class="mx-2 text-slate-300">/</span>
            <span class="text-slate-900 font-medium">#9833-b2</span>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="flex-1 p-6 lg:p-8 overflow-y-auto flex flex-col">
        
        <div class="max-w-6xl mx-auto w-full flex-1 flex flex-col space-y-6">
          
          <!-- Job Header -->
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 fade-in-up" style="animation-delay: 100ms;">
            <div class="flex items-center space-x-4">
              <h1 class="text-3xl font-bold text-slate-900 font-mono tracking-tight">#9833-b2</h1>
              <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-800 border border-green-200 uppercase tracking-wide">
                Done
              </span>
            </div>
            
            <button class="bg-white border border-slate-200 text-blue-600 hover:bg-blue-50 font-bold py-2.5 px-5 rounded-lg shadow-sm transition-all text-sm flex items-center justify-center shrink-0">
              <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              Download Results
            </button>
          </div>

          <!-- Metrics Row -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 fade-in-up" style="animation-delay: 200ms;">
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
              <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">CPU Allotment</p>
              <p class="text-xl font-bold text-slate-800">2 Core</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
              <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">RAM Quota</p>
              <p class="text-xl font-bold text-slate-800">4G</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
              <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">TTL Limit</p>
              <p class="text-xl font-bold text-slate-800">3600s</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
              <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Shard Node</p>
              <p class="text-xl font-bold text-slate-800 font-mono">520A8B0B</p>
            </div>
          </div>

          <!-- Terminal Log Window -->
          <div class="flex-1 min-h-[400px] flex flex-col bg-slate-900 rounded-xl shadow-lg border border-slate-800 overflow-hidden fade-in-up" style="animation-delay: 300ms;">
            <!-- Terminal Header -->
            <div class="bg-slate-800 px-4 py-3 flex items-center justify-between border-b border-slate-700 shrink-0">
              <div class="flex items-center space-x-2">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="text-xs font-mono text-slate-300 font-semibold tracking-wider">ORCHESTRATOR.STDOUT</span>
              </div>
              <div class="flex space-x-1.5">
                <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
              </div>
            </div>
            
            <!-- Terminal Content -->
            <div class="p-5 flex-1 overflow-auto bg-[#0d1117]">
              <pre class="text-sm font-mono text-slate-400 leading-relaxed">Waiting for logs...</pre>
            </div>
          </div>

        </div>

      </div>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
